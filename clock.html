<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極簡巨型倒數計時器</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Google Fonts: JetBrains Mono & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@200;400;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        mono: ['"JetBrains Mono"', 'monospace'],
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* 確保字體數字寬度一致，避免計時過程抖動 */
        .tabular-nums {
            font-variant-numeric: tabular-nums;
        }

        /* 隱藏滾動條 */
        body {
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 數字超大響應式字體計算 */
        .huge-timer-text {
            font-size: clamp(4rem, 24vw, 32vh);
            line-height: 0.9;
            letter-spacing: -0.04em;
        }

        /* --- 三種視覺主題特效 --- */
        /* Style 1: Cyber Purple (夢幻霓虹紫) */
        .theme-purple .timer-glow {
            color: #C084FC;
            text-shadow: 0 0 50px rgba(168, 85, 247, 0.45);
        }
        .theme-purple .primary-bg { background-color: #9333EA; }
        .theme-purple .primary-bg:hover { background-color: #A855F7; }
        .theme-purple .primary-text { color: #C084FC; }
        .theme-purple .primary-border { border-color: rgba(168, 85, 247, 0.4); }
        .theme-purple .progress-fill { background-color: #A855F7; }
        .theme-purple .accent-dot { background-color: #A855F7; }

        /* Style 2: Tiffany Breeze (蒂芬妮清新藍) */
        .theme-tiffany .timer-glow {
            color: #2DD4BF;
            text-shadow: 0 0 50px rgba(20, 184, 166, 0.45);
        }
        .theme-tiffany .primary-bg { background-color: #0D9488; }
        .theme-tiffany .primary-bg:hover { background-color: #14B8A6; }
        .theme-tiffany .primary-text { color: #2DD4BF; }
        .theme-tiffany .primary-border { border-color: rgba(20, 184, 166, 0.4); }
        .theme-tiffany .progress-fill { background-color: #14B8A6; }
        .theme-tiffany .accent-dot { background-color: #14B8A6; }

        /* Style 3: Sunset Amber (暖陽琥珀金) */
        .theme-amber .timer-glow {
            color: #FBBF24;
            text-shadow: 0 0 50px rgba(245, 158, 11, 0.45);
        }
        .theme-amber .primary-bg { background-color: #D97706; }
        .theme-amber .primary-bg:hover { background-color: #F59E0B; }
        .theme-amber .primary-text { color: #FBBF24; }
        .theme-amber .primary-border { border-color: rgba(245, 158, 11, 0.4); }
        .theme-amber .progress-fill { background-color: #F59E0B; }
        .theme-amber .accent-dot { background-color: #F59E0B; }


        /* 當計時結束時的閃爍視覺效果 */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.02); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .timer-ended {
            animation: pulse-ring 1.2s infinite ease-in-out;
            color: #ef4444 !important;
            text-shadow: 0 0 40px rgba(239, 68, 68, 0.5) !important;
        }
    </style>
</head>
<body id="app-body" class="theme-purple bg-slate-950 text-slate-100 transition-colors duration-500 h-screen w-screen flex flex-col justify-between relative font-sans overflow-hidden">

    <!-- 頂部列 (極簡 / 齒輪設定按鈕) -->
    <header class="w-full p-6 flex justify-between items-center z-20 transition-opacity duration-300">
        <div class="flex items-center space-x-3">
            <div class="w-3 h-3 rounded-full accent-dot animate-pulse" id="status-dot"></div>
            <span class="text-xs font-semibold tracking-widest uppercase text-slate-400" id="timer-label">倒數計時器</span>
        </div>

        <div class="flex items-center space-x-2">
            <!-- 全螢幕切換 -->
            <button id="btn-fullscreen" title="全螢幕模式 (F)" class="p-2.5 rounded-2xl bg-slate-900/60 border border-slate-800/80 backdrop-blur-md hover:bg-slate-800 text-slate-400 hover:text-slate-100 transition shadow-lg">
                <i data-lucide="maximize" class="w-5 h-5" id="icon-fullscreen"></i>
            </button>
            <!-- 齒輪設定按鈕 -->
            <button id="btn-settings" title="開啟設定" onclick="openSettingsModal()" class="p-2.5 rounded-2xl bg-slate-900/60 border border-slate-800/80 backdrop-blur-md hover:bg-slate-800 text-slate-400 hover:text-slate-100 transition shadow-lg transform active:rotate-45">
                <i data-lucide="settings" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <!-- 主中央區域：超大數字顯示器 -->
    <main class="flex-1 flex flex-col justify-center items-center relative z-10 px-4">
        <!-- 進度條 (上方極簡線條) -->
        <div class="w-full max-w-4xl h-1 bg-slate-800/60 rounded-full mb-8 overflow-hidden">
            <div id="progress-bar" class="h-full progress-fill transition-all duration-300 rounded-full" style="width: 100%;"></div>
        </div>

        <!-- 數字主體 -->
        <div id="display-container" class="cursor-pointer group flex items-center justify-center select-none" onclick="toggleTimer()">
            <div id="timer-display" class="huge-timer-text font-mono font-bold tracking-tighter timer-glow transition-all duration-300 tabular-nums hover:scale-[1.01]">
                25:00
            </div>
        </div>

        <!-- 狀態微標籤 -->
        <div id="sub-status" class="mt-4 text-sm font-medium text-slate-500 tracking-wider h-6">
            點擊數字或按 [ Space ] 開始/暫停
        </div>
    </main>

    <!-- 底部控制按鈕 -->
    <footer class="w-full p-6 pb-8 flex flex-col items-center justify-center z-20 space-y-6">
        
        <!-- 主要控制核心鈕 -->
        <div class="flex items-center space-x-6">
            <!-- 重設按鈕 -->
            <button id="btn-reset" onclick="resetTimer()" title="重設 (R)" class="p-4 rounded-2xl bg-slate-900/80 hover:bg-slate-800 border border-slate-800 text-slate-400 hover:text-slate-100 transition transform active:scale-95 shadow-lg">
                <i data-lucide="rotate-ccw" class="w-6 h-6"></i>
            </button>

            <!-- 開始/暫停巨型主按鈕 -->
            <button id="btn-play" onclick="toggleTimer()" class="px-10 py-4 rounded-2xl primary-bg text-white font-bold text-lg shadow-xl transition transform active:scale-95 flex items-center space-x-2">
                <i data-lucide="play" id="icon-play" class="w-6 h-6 fill-current"></i>
                <span id="label-play">開始計時</span>
            </button>

            <!-- 增加 1 分鐘按鈕 -->
            <button onclick="addTime(60)" title="增加 1 分鐘" class="p-4 rounded-2xl bg-slate-900/80 hover:bg-slate-800 border border-slate-800 text-slate-400 hover:text-slate-100 transition transform active:scale-95 shadow-lg">
                <i data-lucide="plus" class="w-6 h-6"></i>
            </button>
        </div>

        <!-- 鍵盤快捷鍵提示 -->
        <div class="text-[11px] text-slate-600 font-mono tracking-wider flex items-center space-x-4 pt-1">
            <span><kbd class="px-1.5 py-0.5 rounded bg-slate-900 border border-slate-800 text-slate-400">Space</kbd> 開始/暫停</span>
            <span><kbd class="px-1.5 py-0.5 rounded bg-slate-900 border border-slate-800 text-slate-400">R</kbd> 重設</span>
            <span><kbd class="px-1.5 py-0.5 rounded bg-slate-900 border border-slate-800 text-slate-400">F</kbd> 全螢幕</span>
        </div>
    </footer>

    <!-- 參數與風格設定彈窗 (Settings Modal) -->
    <div id="settings-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300 p-4">
        <div class="bg-slate-900 border border-slate-800 p-6 sm:p-8 rounded-3xl max-w-md w-full shadow-2xl transform scale-95 transition-transform duration-300 max-h-[90vh] overflow-y-auto" id="settings-modal-card">
            
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-slate-100 flex items-center gap-2">
                    <i data-lucide="sliders" class="w-5 h-5 primary-text"></i> 計時器設定
                </h3>
                <button onclick="closeSettingsModal()" class="p-2 rounded-xl text-slate-400 hover:text-slate-100 hover:bg-slate-800 transition">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="space-y-6">
                <!-- 1. 視覺主題風格選擇器 -->
                <div>
                    <label class="text-xs font-semibold uppercase tracking-wider text-slate-400 block mb-3">視覺主題與配色</label>
                    <div class="grid grid-cols-3 gap-2.5">
                        <!-- 紫色風格 -->
                        <button onclick="setTheme('theme-purple')" id="theme-btn-purple" class="theme-option p-3 rounded-2xl border bg-slate-950 text-left transition flex flex-col justify-between h-20 relative overflow-hidden">
                            <span class="text-xs font-semibold text-slate-200">霓虹紫</span>
                            <div class="flex gap-1.5 mt-2">
                                <span class="w-4 h-4 rounded-full bg-purple-500 inline-block shadow"></span>
                                <span class="w-4 h-4 rounded-full bg-purple-900 inline-block"></span>
                            </div>
                        </button>

                        <!-- 蒂芬妮藍風格 -->
                        <button onclick="setTheme('theme-tiffany')" id="theme-btn-tiffany" class="theme-option p-3 rounded-2xl border bg-slate-950 text-left transition flex flex-col justify-between h-20 relative overflow-hidden">
                            <span class="text-xs font-semibold text-slate-200">蒂芬妮藍</span>
                            <div class="flex gap-1.5 mt-2">
                                <span class="w-4 h-4 rounded-full bg-teal-400 inline-block shadow"></span>
                                <span class="w-4 h-4 rounded-full bg-teal-900 inline-block"></span>
                            </div>
                        </button>

                        <!-- 琥珀金風格 -->
                        <button onclick="setTheme('theme-amber')" id="theme-btn-amber" class="theme-option p-3 rounded-2xl border bg-slate-950 text-left transition flex flex-col justify-between h-20 relative overflow-hidden">
                            <span class="text-xs font-semibold text-slate-200">琥珀金</span>
                            <div class="flex gap-1.5 mt-2">
                                <span class="w-4 h-4 rounded-full bg-amber-400 inline-block shadow"></span>
                                <span class="w-4 h-4 rounded-full bg-amber-900 inline-block"></span>
                            </div>
                        </button>
                    </div>
                </div>

                <!-- 2. 深色 / 淺色模式 & 音效切換 -->
                <div class="grid grid-cols-2 gap-3 pt-2">
                    <button id="btn-theme-toggle" class="flex items-center justify-between p-3.5 rounded-2xl bg-slate-950 border border-slate-800 text-slate-300 hover:border-slate-700 transition">
                        <span class="text-xs font-semibold">黑白模式</span>
                        <div class="flex items-center gap-1">
                            <i data-lucide="sun" class="w-4 h-4 text-amber-400 dark:hidden"></i>
                            <i data-lucide="moon" class="w-4 h-4 text-purple-400 hidden dark:block"></i>
                        </div>
                    </button>

                    <button id="btn-sound-toggle" onclick="toggleSound()" class="flex items-center justify-between p-3.5 rounded-2xl bg-slate-950 border border-slate-800 text-slate-300 hover:border-slate-700 transition">
                        <span class="text-xs font-semibold">提示音效</span>
                        <i data-lucide="volume-2" id="icon-sound" class="w-4 h-4 primary-text"></i>
                    </button>
                </div>

                <!-- 3. 快速預設時間顆粒 -->
                <div>
                    <label class="text-xs font-semibold uppercase tracking-wider text-slate-400 block mb-3">快速選擇倒數時間</label>
                    <div class="flex flex-wrap gap-2">
                        <button onclick="setTimerPreset(1)" class="px-3.5 py-2 rounded-xl text-xs font-semibold bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-300 transition">1 分鐘</button>
                        <button onclick="setTimerPreset(5)" class="px-3.5 py-2 rounded-xl text-xs font-semibold bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-300 transition">5 分鐘</button>
                        <button onclick="setTimerPreset(10)" class="px-3.5 py-2 rounded-xl text-xs font-semibold bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-300 transition">10 分鐘</button>
                        <button onclick="setTimerPreset(25)" class="px-3.5 py-2 rounded-xl text-xs font-semibold primary-border primary-text bg-slate-950 transition">25 分鐘 (番茄鐘)</button>
                        <button onclick="setTimerPreset(50)" class="px-3.5 py-2 rounded-xl text-xs font-semibold bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-300 transition">50 分鐘</button>
                    </div>
                </div>

                <!-- 4. 精確自訂時間輸入 -->
                <div class="pt-2">
                    <label class="text-xs font-semibold uppercase tracking-wider text-slate-400 block mb-3">自訂倒數時間</label>
                    <div class="grid grid-cols-3 gap-3 mb-4">
                        <div class="flex flex-col items-center">
                            <label class="text-[11px] text-slate-500 mb-1">時</label>
                            <input type="number" id="input-hours" min="0" max="99" value="0" class="w-full bg-slate-950 border border-slate-800 rounded-xl py-2.5 text-center text-lg font-mono text-slate-100 focus:outline-none focus:border-slate-600">
                        </div>
                        <div class="flex flex-col items-center">
                            <label class="text-[11px] text-slate-500 mb-1">分</label>
                            <input type="number" id="input-minutes" min="0" max="59" value="25" class="w-full bg-slate-950 border border-slate-800 rounded-xl py-2.5 text-center text-lg font-mono text-slate-100 focus:outline-none focus:border-slate-600">
                        </div>
                        <div class="flex flex-col items-center">
                            <label class="text-[11px] text-slate-500 mb-1">秒</label>
                            <input type="number" id="input-seconds" min="0" max="59" value="0" class="w-full bg-slate-950 border border-slate-800 rounded-xl py-2.5 text-center text-lg font-mono text-slate-100 focus:outline-none focus:border-slate-600">
                        </div>
                    </div>
                </div>

            </div>

            <!-- 確認按鈕 -->
            <div class="mt-6 pt-4 border-t border-slate-800/80 flex space-x-3">
                <button onclick="applySettings()" class="w-full py-3.5 rounded-2xl primary-bg text-white font-bold text-sm transition shadow-lg">套用設定</button>
            </div>
        </div>
    </div>

    <script>
        // 初始化 Lucide 圖標
        lucide.createIcons();

        // 核心狀態變數
        let totalSeconds = 25 * 60; // 預設 25 分鐘
        let remainingSeconds = 25 * 60;
        let timerInterval = null;
        let isRunning = false;
        let soundEnabled = true;
        let currentTheme = 'theme-purple';

        // 音訊上下文（用於合成乾淨響亮的提示音效）
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // 播放提示音 (Web Audio API)
        function playBeepSound() {
            if (!soundEnabled) return;
            try {
                initAudio();
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const now = audioCtx.currentTime;
                const playNote = (freq, time, duration) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, time);
                    gain.gain.setValueAtTime(0.3, time);
                    gain.gain.exponentialRampToValueAtTime(0.001, time + duration);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(time);
                    osc.stop(time + duration);
                };

                playNote(523.25, now, 0.2);       // C5
                playNote(659.25, now + 0.25, 0.2); // E5
                playNote(783.99, now + 0.5, 0.4);  // G5
            } catch (e) {
                console.log('Audio Context error:', e);
            }
        }

        // 切換主題風格
        function setTheme(themeName) {
            currentTheme = themeName;
            const body = document.getElementById('app-body');
            body.className = body.className.replace(/theme-\w+/g, themeName);
            
            // 更新設定選單內按鈕高亮
            document.querySelectorAll('.theme-option').forEach(btn => {
                btn.classList.remove('border-purple-500', 'border-teal-500', 'border-amber-500', 'border-2');
                btn.classList.add('border-slate-800');
            });

            const activeBtn = document.getElementById(`theme-btn-${themeName.replace('theme-', '')}`);
            if (activeBtn) {
                activeBtn.classList.remove('border-slate-800');
                activeBtn.classList.add('border-2');
                if (themeName === 'theme-purple') activeBtn.classList.add('border-purple-500');
                if (themeName === 'theme-tiffany') activeBtn.classList.add('border-teal-500');
                if (themeName === 'theme-amber') activeBtn.classList.add('border-amber-500');
            }
        }

        // 格式化時間為 HH:MM:SS 或 MM:SS
        function formatTime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;

            const pad = (num) => String(num).padStart(2, '0');

            if (h > 0) {
                return `${pad(h)}:${pad(m)}:${pad(s)}`;
            }
            return `${pad(m)}:${pad(s)}`;
        }

        // 更新畫面顯示
        function updateDisplay() {
            const displayEl = document.getElementById('timer-display');
            const formatted = formatTime(remainingSeconds);
            displayEl.textContent = formatted;

            // 更新分頁標題
            document.title = `(${formatted}) 倒數計時器`;

            // 更新進度條
            const percentage = totalSeconds > 0 ? (remainingSeconds / totalSeconds) * 100 : 0;
            const progressBar = document.getElementById('progress-bar');
            progressBar.style.width = `${percentage}%`;

            // 隨時間改變進度條顏色警告
            if (percentage < 15) {
                progressBar.className = "h-full bg-rose-500 transition-all duration-300 rounded-full";
            } else if (percentage < 35) {
                progressBar.className = "h-full bg-amber-500 transition-all duration-300 rounded-full";
            } else {
                progressBar.className = "h-full progress-fill transition-all duration-300 rounded-full";
            }
        }

        // 切換計時 (開始 / 暫停)
        function toggleTimer() {
            initAudio();
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            if (remainingSeconds <= 0) return;

            isRunning = true;
            document.getElementById('timer-display').classList.remove('timer-ended');
            
            // 更新 UI 狀態
            document.getElementById('label-play').textContent = '暫停計時';
            const iconPlay = document.getElementById('icon-play');
            iconPlay.setAttribute('data-lucide', 'pause');
            lucide.createIcons();

            document.getElementById('status-dot').className = "w-3 h-3 rounded-full accent-dot animate-ping";
            document.getElementById('sub-status').textContent = "計時中...";

            let expected = Date.now() + 1000;
            timerInterval = setInterval(() => {
                remainingSeconds--;
                updateDisplay();

                if (remainingSeconds <= 0) {
                    onTimerEnd();
                } else {
                    expected += 1000;
                }
            }, 1000);
        }

        function pauseTimer() {
            isRunning = false;
            clearInterval(timerInterval);

            document.getElementById('label-play').textContent = '繼續計時';
            const iconPlay = document.getElementById('icon-play');
            iconPlay.setAttribute('data-lucide', 'play');
            lucide.createIcons();

            document.getElementById('status-dot').className = "w-3 h-3 rounded-full bg-amber-500";
            document.getElementById('sub-status').textContent = "已暫停";
        }

        function resetTimer() {
            pauseTimer();
            remainingSeconds = totalSeconds;
            document.getElementById('timer-display').classList.remove('timer-ended');
            document.getElementById('label-play').textContent = '開始計時';
            document.getElementById('status-dot').className = "w-3 h-3 rounded-full accent-dot";
            document.getElementById('sub-status').textContent = "點擊數字或按 [ Space ] 開始/暫停";
            updateDisplay();
        }

        function onTimerEnd() {
            pauseTimer();
            remainingSeconds = 0;
            updateDisplay();

            document.getElementById('timer-display').classList.add('timer-ended');
            document.getElementById('sub-status').textContent = "⏰ 時間到！";
            document.getElementById('status-dot').className = "w-3 h-3 rounded-full bg-rose-500 animate-bounce";

            playBeepSound();
        }

        // 快速設定預設時間 (分鐘)
        function setTimerPreset(minutes) {
            totalSeconds = minutes * 60;
            
            // 同步輸入框
            document.getElementById('input-hours').value = Math.floor(minutes / 60);
            document.getElementById('input-minutes').value = minutes % 60;
            document.getElementById('input-seconds').value = 0;

            resetTimer();
        }

        // 增加時間 (秒)
        function addTime(seconds) {
            totalSeconds += seconds;
            remainingSeconds += seconds;
            updateDisplay();
        }

        // 鍵盤快捷鍵監聽
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;

            if (e.code === 'Space') {
                e.preventDefault();
                toggleTimer();
            } else if (e.code === 'KeyR') {
                resetTimer();
            } else if (e.code === 'KeyF') {
                toggleFullScreen();
            }
        });

        // 全螢幕開關
        function toggleFullScreen() {
            const icon = document.getElementById('icon-fullscreen');
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
                icon.setAttribute('data-lucide', 'minimize');
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    icon.setAttribute('data-lucide', 'maximize');
                }
            }
            lucide.createIcons();
        }

        document.getElementById('btn-fullscreen').addEventListener('click', toggleFullScreen);

        // 深色 / 淺色主題切換
        const btnThemeToggle = document.getElementById('btn-theme-toggle');
        btnThemeToggle.addEventListener('click', () => {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                html.classList.add('light');
                document.body.classList.remove('bg-slate-950', 'text-slate-100');
                document.body.classList.add('bg-slate-50', 'text-slate-900');
            } else {
                html.classList.remove('light');
                html.classList.add('dark');
                document.body.classList.remove('bg-slate-50', 'text-slate-900');
                document.body.classList.add('bg-slate-950', 'text-slate-100');
            }
        });

        // 音效開關
        function toggleSound() {
            soundEnabled = !soundEnabled;
            const iconSound = document.getElementById('icon-sound');
            if (soundEnabled) {
                iconSound.setAttribute('data-lucide', 'volume-2');
                iconSound.className = "w-4 h-4 primary-text";
            } else {
                iconSound.setAttribute('data-lucide', 'volume-x');
                iconSound.className = "w-4 h-4 text-slate-600";
            }
            lucide.createIcons();
        }

        // 設定 Modal 邏輯
        function openSettingsModal() {
            pauseTimer();
            const modal = document.getElementById('settings-modal');
            const card = document.getElementById('settings-modal-card');
            
            const h = Math.floor(totalSeconds / 3600);
            const m = Math.floor((totalSeconds % 3600) / 60);
            const s = totalSeconds % 60;

            document.getElementById('input-hours').value = h;
            document.getElementById('input-minutes').value = m;
            document.getElementById('input-seconds').value = s;

            modal.classList.remove('opacity-0', 'pointer-events-none');
            card.classList.remove('scale-95');
            card.classList.add('scale-100');
        }

        function closeSettingsModal() {
            const modal = document.getElementById('settings-modal');
            const card = document.getElementById('settings-modal-card');
            
            card.classList.remove('scale-100');
            card.classList.add('scale-95');
            modal.classList.add('opacity-0', 'pointer-events-none');
        }

        function applySettings() {
            const h = parseInt(document.getElementById('input-hours').value) || 0;
            const m = parseInt(document.getElementById('input-minutes').value) || 0;
            const s = parseInt(document.getElementById('input-seconds').value) || 0;

            const computedSeconds = (h * 3600) + (m * 60) + s;
            if (computedSeconds > 0) {
                totalSeconds = computedSeconds;
                resetTimer();
                closeSettingsModal();
            }
        }

        // 初始初始化
        setTheme('theme-purple');
        updateDisplay();
    </script>
</body>
</html>
